# Local hooks use the ruff and pytest already pinned in requirements-dev.lock, so the
# hook versions cannot drift from the lock file.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: python -m ruff format --check --force-exclude
        language: system
        types: [python]
      - id: synthetic-fixture-unchanged
        name: synthetic fixture matches its generator
        entry: python -X utf8 -m pytest -q tests/test_synthetic_corpus.py -k fixture
        language: system
        pass_filenames: false
        files: ^(src/morphtok/data/synthetic\.py|tests/fixtures/synthetic/.*)$
      - id: no-large-data
        name: block committed corpora in data/raw or data/processed
        entry: python -c "import sys; bad=[f for f in sys.argv[1:] if not f.endswith('README.md')]; print(*bad); sys.exit(bool(bad))"
        language: system
        files: ^data/(raw|processed)/
