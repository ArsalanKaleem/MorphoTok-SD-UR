# Urdu dataset configuration.
# Corpus: PILOT sample of Urdu Wikipedia (dump 2023-11-01), prepared by
# scripts/prepare_wikipedia.py (see data/raw/SOURCE.md and the manifest next to the file).
name: urdu
language: ur
synthetic: false
corpus:
  path: data/processed/ur_wiki20231101_pilot5000.txt   # 5,000 lines; manifest: *.manifest.json
  licence: "CC BY-SA 3.0 / GFDL (Wikipedia; per huggingface.co/datasets/wikimedia/wikipedia)"
  domain: encyclopedia
gold:
  path: data/gold/ur_silver.tsv   # SILVER (lemma-derived, scripts/build_silver.py); split by lemma; NOT gold
paradigms:
  path: data/gold/ur_paradigms_heldout.json   # dev/test lemmas only
zwnj_annotations:
  path: null          # TODO(annotation): data/audit/urdu_zwnj_annotations.tsv
analyzer:
  type: lemma_derived            # silver supervision from TRAIN-split lemmas only
  silver_path: data/gold/ur_silver.tsv
  use_splits: [train]
  base_confidence: 0.8           # PILOT constant, uncalibrated
  # real analyzer still TODO(resource)
split:
  salt: morphtok-urdu
  unit: line
