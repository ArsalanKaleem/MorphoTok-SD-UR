# Sindhi dataset configuration.
# AUDIT config (Gate 1): ALL eligible lines of Sindhi Wikipedia (dump 2023-11-01), prepared by
# scripts/prepare_wikipedia.py (see data/raw/SOURCE.md and the manifest next to the file).
# Single domain (encyclopedia); no news corpus yet (Family F needs one).
name: sindhi_audit
language: sd
synthetic: false
corpus:
  path: data/processed/sd_wiki20231101_pilot66141.txt   # ALL eligible lines (for the Gate 1 audit only); manifest: *.manifest.json
  licence: "CC BY-SA 3.0 / GFDL (Wikipedia; per huggingface.co/datasets/wikimedia/wikipedia)"
  domain: encyclopedia
gold:
  path: null          # TODO(annotation): data/gold/sindhi_gold.tsv after the audit protocol
zwnj_annotations:
  path: null          # TODO(annotation): data/audit/sindhi_zwnj_annotations.tsv
analyzer:
  type: sindhi_rules
  rules_path: null    # TODO(resource): provenance-bearing affix rule file; none ships with the repo
split:
  salt: morphtok-sindhi
  unit: line          # TODO(data): switch to document-level splits if document IDs exist
