# Sindhi dataset configuration.
# Corpus: PILOT sample of Sindhi Wikipedia (dump 2023-11-01), prepared by
# scripts/prepare_wikipedia.py (see data/raw/SOURCE.md and the manifest next to the file).
# Encyclopedia domain; web-domain variants: sindhi_web.yaml, sindhi_web_audit.yaml.
name: sindhi_20k
language: sd
synthetic: false
corpus:
  path: data/processed/sd_wiki20231101_pilot20000.txt   # 20,000 lines (scale check); manifest: *.manifest.json
  licence: "CC BY-SA 3.0 / GFDL (Wikipedia; per huggingface.co/datasets/wikimedia/wikipedia)"
  domain: encyclopedia
gold:
  path: data/gold/sd_silver.tsv   # SILVER (lemma-derived, scripts/build_silver.py); split by lemma; NOT gold
paradigms:
  path: data/gold/sd_paradigms_heldout.json   # dev/test lemmas only
zwnj_annotations:
  path: null          # TODO(annotation): data/audit/sindhi_zwnj_annotations.tsv
analyzer:
  type: lemma_derived            # silver supervision from TRAIN-split lemmas only
  silver_path: data/gold/sd_silver.tsv
  use_splits: [train]
  base_confidence: 0.8           # PILOT constant, uncalibrated
  # real analyzer still TODO(resource)
split:
  salt: morphtok-sindhi
  unit: line          # TODO(data): switch to document-level splits if document IDs exist
