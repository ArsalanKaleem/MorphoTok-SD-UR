# SYNTHETIC dataset (integration tests only). Added beyond the required tree so that
# every script can run end-to-end without external data. Not Sindhi, not Urdu.
name: synthetic
language: synthetic
synthetic: true
corpus:
  path: tests/fixtures/synthetic/SYNTHETIC_corpus.txt
  licence: "generated by src/morphtok/data/synthetic.py (project-internal)"
  domain: synthetic
gold:
  path: tests/fixtures/synthetic/SYNTHETIC_gold.tsv   # construction-time gold, dev/test split by type
zwnj_annotations:
  path: null            # synthetic labels are derived from gold (oracle), never from annotators
analyzer:
  type: synthetic_oracle   # refuses to run on non-synthetic data
  confidence: 0.9
split:
  salt: morphtok-synthetic
