# Intrinsic evaluation settings. Fixed before looking at test results.
primary_metric: boundary_f1          # micro F1 over gold types, stripped coordinates
secondary_metrics: [boundary_precision, boundary_recall, exact_match, fertility, tokens_per_char, mean_token_len]
eval_split: dev                      # 'test' only for the final, preregistered report
reference_system: unigram
frequency_bins: [0, 1, 5, 20]        # training-frequency upper edges: 0=unseen, 1, 2-5, 6-20, >20
bootstrap: {n_boot: 1000, level: 0.95}
randomization: {n_perm: 1000}
thresholds:                          # UNRESOLVED until the pilot; see prereg/decision_gates.md
  min_f1_gain: null
  max_fertility_increase: null
