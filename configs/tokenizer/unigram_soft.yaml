# Unigram with a confidence-weighted SOFT boundary prior (Objectives A/C).
# Uses the SAME constraint set as unigram_hard so that the lambda -> inf limit is the
# hard condition (see docs/lattice.md).
name: unigram_soft
type: unigram
normalization: {unicode_form: NFC, zwnj: preserve}
requires_analyzer: true
max_piece_len: 8
train_mode: soft
decode_mode: soft
lambda: 2.0   # PILOT value only (nats per unit penalty). TODO(pilot): choose on dev via 05_ablation_grid.
supervision:
  proposed_kind: MANDATORY
  min_confidence: 0.0
  penalty: linear
  covered_absent: unknown
  format_char_attach: left
trainer: {seed_multiplier: 4, shrink: 0.6, em_iters: 1, final_em_iters: 2, min_seed_freq: 2}
