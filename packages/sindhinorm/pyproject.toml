[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sindhinorm"
version = "0.1.0"
description = "Corpus-guided, native-validated spelling normalizer for Sindhi (Arabic script)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Arsalan Kaleem" }]
keywords = ["sindhi", "nlp", "normalization", "unicode", "arabic-script", "spelling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ArsalanKaleem/MorphoTok-SD-UR/tree/main/packages/sindhinorm"
Evaluation = "https://github.com/ArsalanKaleem/MorphoTok-SD-UR/blob/main/docs/sdnorm.md"
Playground = "https://arsalankaleem.github.io/MorphoTok-SD-UR/"

[project.scripts]
sindhinorm = "sindhinorm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sindhinorm = ["data/*.json.gz", "py.typed"]
